# Testes, lint e auditoria de dependências a cada push e pull request.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: trilha}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trilha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install pip-audit flake8
      - run: flake8 --select=E9,F --exclude=migrations config contas core disciplinas
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: pip-audit -r requirements.txt --progress-spinner off
